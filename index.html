<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurikulum Smantib — Portal Perangkat & Dokumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #696cff;
      --primary-hover: #5f61e6;
      --primary-soft: #e7e7ff;
      --success: #71dd37;
      --success-soft: #e8fadf;
      --info: #03c3ec;
      --info-soft: #d7f5fc;
      --warning: #ffab00;
      --warning-soft: #fff2d6;
      --danger: #ff3e1d;
      --danger-soft: #ffe0db;
      --bg-body: #f5f5f9;
      --bg-card: #ffffff;
      --text-heading: #4b5c6b;
      --text-body: #697a8d;
      --text-muted: #a1acb8;
      --border-color: #e4e6eb;
      --shadow: 0 2px 8px rgba(67, 89, 113, 0.09);
      --radius: 0.65rem;
    }

    * { box-sizing: border-box; font-family: 'Public Sans', system-ui, -apple-system, sans-serif; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg-body); color: var(--text-body); display: flex; min-height: 100vh; }

    /* ================= SIDEBAR PC & DRAWER HP ================= */
    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(34, 48, 62, 0.45);
      z-index: 998; backdrop-filter: blur(2px);
    }
    .sidebar-backdrop.show { display: block; }

    .sidebar {
      width: 260px; background: var(--bg-card); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0;
      z-index: 999; transition: transform 0.25s ease;
    }
    .brand {
      display: flex; align-items: center; gap: 0.75rem; padding: 1.35rem 1.4rem;
      text-decoration: none; color: var(--text-heading); font-weight: 700; font-size: 1.2rem;
      border-bottom: 1px solid #f1f2f6;
    }
    .brand-logo {
      width: 34px; height: 34px; border-radius: 9px; background: var(--primary);
      display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1rem;
      box-shadow: 0 3px 8px rgba(105, 108, 255, 0.35); flex-shrink: 0;
    }
    .menu-list { list-style: none; padding: 0.75rem 0.85rem; margin: 0; flex: 1; overflow-y: auto; }
    .menu-header {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-muted); padding: 1rem 0.85rem 0.45rem;
    }
    .menu-item { margin-bottom: 0.3rem; position: relative; }
    .menu-link {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.68rem 0.9rem;
      border-radius: 0.45rem; text-decoration: none; color: var(--text-body);
      font-size: 0.92rem; font-weight: 500; transition: all 0.15s ease; cursor: pointer;
      border: none; background: transparent; width: 100%; text-align: left;
    }
    .menu-link:hover { background: #f4f5f8; color: var(--text-heading); }
    .menu-item.active .menu-link {
      background: var(--primary-soft); color: var(--primary); font-weight: 600;
    }
    .menu-item.active::after {
      content: ""; position: absolute; right: -0.85rem; top: 18%; height: 64%; width: 4px;
      background: var(--primary); border-radius: 4px 0 0 4px;
    }
    .sidebar-card {
      margin: 1rem; padding: 1.15rem; border-radius: var(--radius);
      background: linear-gradient(135deg, #f3f3ff 0%, #e7e7ff 100%);
      text-align: center; border: 1px solid rgba(105, 108, 255, 0.18);
    }
    .sidebar-card h4 { margin: 0 0 0.35rem; color: var(--text-heading); font-size: 0.95rem; }
    .sidebar-card p { margin: 0 0 0.85rem; font-size: 0.78rem; color: var(--text-body); line-height: 1.45; }

    /* ================= AREA KONTEN UTAMA ================= */
    .main-wrapper { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }
    .content-container { max-width: 1380px; width: 100%; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }

    /* ================= NAVBAR ATAS ================= */
    .navbar {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 0.65rem 1.2rem; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.4rem; gap: 0.75rem; position: sticky; top: 0.75rem; z-index: 90;
    }
    .mobile-toggle {
      display: none; background: #f4f5f8; border: none; width: 38px; height: 38px;
      border-radius: 8px; font-size: 1.25rem; color: var(--text-heading); cursor: pointer;
    }
    .search-box { display: flex; align-items: center; gap: 0.55rem; flex: 1; max-width: 440px; }
    .search-box input {
      border: none; outline: none; font-size: 0.92rem; color: var(--text-heading); width: 100%; background: transparent;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .kbd-badge {
      font-size: 0.7rem; color: var(--text-muted); border: 1px solid var(--border-color);
      padding: 0.15rem 0.45rem; border-radius: 4px; white-space: nowrap;
    }
    .nav-actions { display: flex; align-items: center; gap: 0.6rem; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border-color); background: #fff;
      color: var(--text-heading); display: grid; place-items: center; cursor: pointer;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--bg-body); color: var(--primary); }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ================= TOMBOL ================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
      padding: 0.55rem 1.05rem; border-radius: 0.45rem; border: none; font-size: 0.86rem;
      font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.15s ease; white-space: nowrap;
    }
    .btn-primary {
      background: var(--primary); color: #fff; box-shadow: 0 3px 8px rgba(105, 108, 255, 0.35);
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-soft-primary { background: var(--primary-soft); color: var(--primary); }
    .btn-soft-primary:hover { background: #d8d9ff; }
    .btn-soft-info { background: var(--info-soft); color: #028fb0; }
    .btn-soft-info:hover { background: #bfeaf6; }
    .btn-outline { background: #fff; border: 1px solid var(--border-color); color: var(--text-body); }
    .btn-outline:hover { background: var(--bg-body); color: var(--text-heading); }

    /* ================= HERO BANNER & RINGKASAN ================= */
    .hero-grid {
      display: grid; grid-template-columns: 1.65fr 1fr; gap: 1.4rem; margin-bottom: 1.4rem;
    }
    .card {
      background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.35rem;
    }
    .welcome-card {
      display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; padding: 1.5rem 1.75rem;
    }
    .welcome-badge {
      display: inline-block; background: var(--primary-soft); color: var(--primary);
      font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.65rem; border-radius: 20px; margin-bottom: 0.6rem;
    }
    .welcome-text h1 { margin: 0 0 0.5rem; color: var(--text-heading); font-size: 1.4rem; font-weight: 700; }
    .welcome-text p { margin: 0 0 1.15rem; color: var(--text-body); font-size: 0.9rem; line-height: 1.55; max-width: 480px; }
    .hero-btns { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .welcome-illustration { width: 155px; flex-shrink: 0; }

    .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .stat-box { padding: 1.1rem; display: flex; flex-direction: column; justify-content: space-between; }
    .stat-icon {
      width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; margin-bottom: 0.65rem;
    }
